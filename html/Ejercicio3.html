<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro Sencillo</title>
</head>
<body>

    <h1>Formulario de Registro</h1>

    <form action="#" method="POST">

        
        <fieldset>
            <legend>Información Personal</legend>
            <br>

            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" required><br><br>

            <label for="apellido">Apellido:</label><br>
            <input type="text" id="apellido" name="apellido" required><br><br>

            <label for="fechaNacimiento">Fecha de Nacimiento:</label><br>
            <input type="date" id="fechaNacimiento" name="fechaNacimiento" required><br><br>

            <label>Género:</label><br>
            <input type="radio" id="masculino" name="genero" value="Masculino" required>
            <label for="masculino">Masculino</label><br>
            <input type="radio" id="femenino" name="genero" value="Femenino" required>
            <label for="femenino">Femenino</label><br>
            <input type="radio" id="otro" name="genero" value="Otro" required>
            <label for="otro">Otro</label><br><br>
        </fieldset>

        <br>

        
        <fieldset>
            <legend>Información de Contacto</legend>
            <br>

            <label for="email">Dirección de Correo Electrónico:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="telefono">Número de Teléfono:</label><br>
            <input type="tel" id="telefono" name="telefono" required><br><br>

            <label for="direccion">Dirección:</label><br>
            <textarea id="direccion" name="direccion" rows="4" cols="30"></textarea><br><br>
        </fieldset>

        <br>

      
        <fieldset>
            <legend>Información de Cuenta</legend>
            <br>

            <label for="usuario">Nombre de Usuario:</label><br>
            <input type="text" id="usuario" name="usuario" required><br><br>

            <label for="password">Contraseña:</label><br>
            <input type="password" id="password" name="password" required><br><br>

            <label for="confirmPassword">Confirmación de Contraseña:</label><br>
            <input type="password" id="confirmPassword" name="confirmPassword" required><br><br>
        </fieldset>

        <br>
        

        <fieldset>
            <legend>Preferencias</legend>
            <br>



            <label for="colorFavorito">Seleccionar un Color Favorito:</label><br>
            <select id="colorFavorito" name="colorFavorito">
                <option value="Rojo">Rojo</option>
                <option value="Azul">Azul</option>
                <option value="Verde">Verde</option>
                <option value="Amarillo">Amarillo</option>
            </select><br><br>

            <input type="checkbox" id="terminos" name="terminos" required>
            <label for="terminos">Aceptar Términos y Condiciones</label><br><br>
        </fieldset>

        <br>

        


        <button type="submit">Enviar Registro</button>

    </form>

</body>
</html>
